services:
  registry:
    image: registry:3.1.2
    environment:
      REGISTRY_HTTP_RELATIVEURLS: "true"
    ports:
      - "127.0.0.1:15001:5000"
    volumes:
      - registry-data:/var/lib/registry

  mirror:
    image: ${OCI_MIRROR_IMAGE:-oci-mirror:local}
    build: .
    ports:
      - "127.0.0.1:15000:15000"
    depends_on:
      - registry
    command:
      - -listen=0.0.0.0:15000
      - -backend=http://registry:5000
      - -cache-dir=/var/lib/oci-mirror/cache
    volumes:
      - mirror-cache:/var/lib/oci-mirror/cache

volumes:
  registry-data:
  mirror-cache:
